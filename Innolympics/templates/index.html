<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Legislative Pulse</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,300italic,700,700italic">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.min.css">
</head>
<body>
    <div class="container">
        <h1>Legislative Pulse</h1>
        <p>Tracking progress in Congress</p>
        <hr>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Bill Title & Summary</th>
                    <th>Author</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for bill in bills %}
                <tr>
                    <td><strong>{{ bill.id }}</strong></td>
                    <td>
                        <strong>{{ bill.title }}</strong><br>
                        <small>{{ bill.summary }}</small>
                    </td>
                    <td>{{ bill.author }}</td>
                    <td><mark>{{ bill.status }}</mark></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
